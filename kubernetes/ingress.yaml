apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: interview-app
  namespace: interview-lab
spec:
  ingressClassName: traefik
  rules:
    - host: interview-app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: interview-app
                port:
                  number: 80
